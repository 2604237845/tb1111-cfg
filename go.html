<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打开面板探针</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0f1115;color:#e6e8ee;font:15px/1.7 -apple-system,"PingFang SC",sans-serif;padding:24px 16px}
  h1{font-size:20px;margin:0 0 8px;color:#ffd666}
  p{color:#9aa3b5;font-size:14px;margin:8px 0}
  .card{background:#181b22;border:1px solid #262a34;border-radius:12px;padding:16px;margin:16px 0}
  a.btn{display:block;text-align:center;padding:16px;border-radius:10px;background:#2b6cff;color:#fff;
        font-size:17px;font-weight:700;text-decoration:none;margin:12px 0}
  a.btn:active{opacity:.75}
  a.g{background:#2a2f3a;color:#cfd6e4;font-size:15px;font-weight:600}
  code{font:12px Menlo,monospace;color:#8fd0ff;word-break:break-all}
  .tip{font-size:13px;color:#7a8296;line-height:1.8}
  .warn{color:#ffb84d}
</style>
</head>
<body>
<h1>淘金币面板探针</h1>

<div id="intb" class="card" style="display:none">
  <p class="warn">检测到你在淘宝 App 内。</p>
  <p>直接打开探针页即可：</p>
  <a class="btn" id="direct" href="#">打开探针页</a>
</div>

<div id="outside">
  <p>这个链接必须在<strong style="color:#ffd666">淘宝 App 内</strong>打开才能用（需要 App 的登录态和安全通道）。</p>

  <div class="card">
    <p style="margin-top:0"><strong>方法一（推荐）</strong>：点下面按钮，会弹出「在"淘宝"中打开」，选打开。</p>
    <a class="btn" id="jump" href="#">在淘宝中打开探针页</a>
  </div>

  <div class="card">
    <p style="margin-top:0"><strong>方法二</strong>：复制下面这行，粘到 Safari 地址栏回车。</p>
    <code id="scheme"></code>
  </div>

  <div class="card">
    <p style="margin-top:0"><strong>方法三</strong>：如果上面都不行，直接在浏览器打开探针页（能看诊断，但大概调不通接口）。</p>
    <a class="btn g" id="plain" href="#">直接打开探针页</a>
  </div>
</div>

<p class="tip">打开后页面会自动跑完探测，把结果复制发回来就行。</p>

<script>
(function () {
  var PROBE = 'https://2604237845.github.io/tb1111-cfg/probe.html';
  var SCHEME = 'taobao://m.taobao.com/tbopen/index.html?h5Url=' + encodeURIComponent(PROBE);
  var ua = navigator.userAgent || '';
  var inTB = /AliApp\(TB\//i.test(ua) || /WindVane/i.test(ua);

  document.getElementById('scheme').textContent = SCHEME;
  document.getElementById('plain').href = PROBE;
  document.getElementById('jump').href = SCHEME;
  document.getElementById('direct').href = PROBE;

  if (inTB) {
    document.getElementById('intb').style.display = 'block';
    document.getElementById('outside').style.display = 'none';
  }
})();
</script>
</body>
</html>
