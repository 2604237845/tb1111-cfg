<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>任务</title>
<style>
body{margin:0;font-family:-apple-system,sans-serif;background:#7d4cd5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#big{font-size:22px;text-align:center;padding:0 24px;line-height:1.6}
#big b{color:#ffd58c;font-size:30px}
#sub{margin-top:16px;font-size:13px;opacity:.8;text-align:center;padding:0 20px}
#log{position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,.92);color:#333;font-size:11px;line-height:1.5;padding:4px 6px;max-height:32%;overflow:auto;font-family:monospace;z-index:9}
</style>
</head>
<body>
<div id="log"></div>
<div id="big">正在连接任务…</div>
<div id="sub"></div>
<script src="https://g.alicdn.com/mtb/lib-mtop/2.7.2/mtop.js"></script>
<script>
(function(){
var logBox = document.getElementById('log');
function log(msg, color){
  var d = document.createElement('div');
  var t = new Date().toTimeString().slice(0,8);
  d.innerHTML = '<b style="color:'+(color||'#1a5fb4')+'">'+t+'</b> '+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  logBox.appendChild(d);
}
function setBig(html){ document.getElementById('big').innerHTML = html; }
function setSub(t){ document.getElementById('sub').textContent = t || ''; }

// ===== 参数 =====
var qs = {}; location.search.replace(/^\?/,'').split('&').forEach(function(kv){
  var p = kv.split('='); if(p[0]) qs[p[0]] = decodeURIComponent((p[1]||'').replace(/\+/g,' '));
});
var sceneId = qs.sceneId || '8917';
var deliveryId = qs.deliveryId || '';
var implId = qs.implId || ('other_1395_0_' + deliveryId + '_0');
var waitSec = Number(qs.wait) || 10;
log('参数: sceneId=' + sceneId + ' deliveryId=' + deliveryId);
log('implId=' + implId);
log('mtop.js ' + (typeof mtop !== 'undefined' ? '已加载' : '未加载!'), typeof mtop !== 'undefined' ? '#0a7d32' : '#d0021b');
if (typeof mtop === 'undefined') { setBig('页面加载异常，请截图发回'); return; }
if (!deliveryId) { setBig('缺少任务参数'); return; }

// ===== 第 1 步：查任务 =====
setBig('正在连接任务…');
mtop.request({
  api: 'mtop.taobao.pentaprism.scene.queryItem', v: '1.0',
  data: {sceneId: sceneId, deliveryId: deliveryId}, ecode: 1, H5Request: true, timeout: 12000
}, function(r){
  try {
    var m = (r && r.data && r.data.model) || {};
    var pr = m.progress || {};
    var st = pr.status || '';
    var asac = (m.taskParams || {}).asac || '';
    var dur = Number((m.assets || {}).duration) || waitSec;
    log('queryItem OK: status=' + st + ' need=' + pr.needTimes + '/' + pr.maxTimes + ' asac=' + (asac||'(空)') + ' dur=' + (m.assets||{}).duration, '#0a7d32');
    if (st === 'COMPLETE' || (pr.needTimes === 0 && pr.maxTimes && pr.times !== null && pr.times >= pr.maxTimes)) {
      setBig('本轮任务已完成'); setSub('等下一轮投放'); return;
    }
    if (st !== 'ACCEPTED') { setBig('任务状态：' + st); setSub('不启动倒计时'); log('非 ACCEPTED: ' + st); return; }
    // ===== 第 2 步：倒计时 =====
    var n = dur;
    setBig('浏览本页面 <b>' + n + '</b> 秒后，可获得奖励');
    var timer = setInterval(function(){
      n--;
      if (n > 0) { setBig('浏览本页面 <b>' + n + '</b> 秒后，可获得奖励'); return; }
      clearInterval(timer);
      setBig('正在领取奖励…');
      // ===== 第 3 步：发计数 =====
      mtop.request({
        api: 'mtop.taobao.pentaprism.scene.trigger', v: '1.0',
        data: {sceneId: sceneId, deliveryId: deliveryId, implId: implId, asac: asac},
        ecode: 1, H5Request: true, timeout: 12000
      }, function(r2){
        try {
          var m2 = (r2 && r2.data && r2.data.model) || {};
          var st2 = m2.status || '';
          var ec = (r2 && r2.data && r2.data.errorCode) || '';
          log('trigger 返回: status=' + st2 + ' errorCode=' + ec, (st2==='CURRENT_COMPLETE'||st2==='AWARDING'||st2==='COMPLETE') ? '#0a7d32' : '#d0021b');
          log('trigger 全文: ' + JSON.stringify(r2).slice(0, 500));
          if (st2 === 'CURRENT_COMPLETE' || st2 === 'AWARDING' || st2 === 'COMPLETE') {
            setBig('任务完成，奖励已发放'); setSub('');
          } else if (ec === 'request_auth_failed') {
            setBig('领取被拦截（来源校验）'); setSub('把本页截图发给助手分析');
          } else {
            setBig('返回：' + (st2 || ec || '未知')); setSub('截图发助手');
          }
        } catch(err){ setBig('解析异常'); log('trigger parse ERR: '+err); }
      }, function(e){
        setBig('领取请求失败'); log('trigger FAIL: ' + JSON.stringify(e).slice(0,400), '#d0021b');
      });
    }, 1000);
  } catch(err){ setBig('解析异常'); log('queryItem parse ERR: ' + err, '#d0021b'); }
}, function(e){
  var s = JSON.stringify(e);
  setBig('任务查询失败');
  log('queryItem FAIL: ' + s.slice(0,400), '#d0021b');
  log('提示：若提示未登录，说明此容器 Cookie 不通', '#d0021b');
  setSub('截图发助手');
});
})();
</script>
</body>
</html>
