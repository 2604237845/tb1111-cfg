<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>任务（原生通道版）</title>
<style>
body{margin:0;font-family:-apple-system,sans-serif;background:#7d4cd5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#big{font-size:22px;text-align:center;padding:0 24px;line-height:1.6}
#big b{color:#ffd58c;font-size:30px}
#sub{margin-top:16px;font-size:13px;opacity:.85;text-align:center;padding:0 20px}
#log{position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,.94);color:#222;font-size:11px;line-height:1.55;padding:4px 6px;max-height:40%;overflow:auto;font-family:monospace;z-index:9}
</style>
</head>
<body>
<div id="log"></div>
<div id="big">正在连接任务…</div>
<div id="sub"></div>
<script src="https://g.alicdn.com/mtb/lib-windvane/3.0.7/windvane.js"></script>
<script>
(function(){
var logBox = document.getElementById('log');
function log(msg, color){
  var d = document.createElement('div');
  var t = new Date().toTimeString().slice(0,8);
  d.innerHTML = '<b style="color:'+(color||'#1a5fb4')+'">'+t+'</b> '+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  logBox.appendChild(d);
}
function setBig(html){ document.getElementById('big').innerHTML = html; }
function setSub(t){ document.getElementById('sub').textContent = t || ''; }

// ===== 参数 =====
var qs = {}; location.search.replace(/^\?/,'').split('&').forEach(function(kv){
  var p = kv.split('='); if(p[0]) qs[p[0]] = decodeURIComponent((p[1]||'').replace(/\+/g,' '));
});
var sceneId = qs.sceneId || '8917';
var deliveryId = qs.deliveryId || '';
var implId = qs.implId || ('other_1395_0_' + deliveryId + '_0');
var waitSec = Number(qs.wait) || 10;
log('参数: ' + sceneId + ' / ' + deliveryId);
log('implId=' + implId);
log('UA 含 WindVane: ' + (/WindVane[\/\s]([\d\.]+)/.test(navigator.userAgent) ? RegExp.$1 : '无'), '#b26b00');

// ===== WindVane 原生 mtop 通道（复刻官方模块 24 的 c 函数）=====
function wvMtop(params, onOk, onFail){
  try {
    var r = Object.assign({}, params);
    r.param = r.data || r.param;
    if (r.type === 'POST') r.post = '1';
    if (!r.sessionOption) r.sessionOption = 'AutoLoginOnly';
    var handler = function(e){
      if (typeof e === 'string') { try { e = JSON.parse(e); } catch(x){} }
      var ok = false;
      if (e && (e.retType === 0 || (e.ret && e.ret[0] && e.ret[0].indexOf('SUCCESS') > -1))) ok = true;
      if (ok) onOk(e); else onFail(e);
    };
    log('→ [原生通道] MtopWVPlugin.send ' + params.api, '#b26b00');
    window.lib.windvane.call('MtopWVPlugin', 'send', r, handler, handler, 15000);
  } catch(err) {
    log('windvane 调用异常: ' + err.message, '#d0021b');
    onFail({error: err.message});
  }
}

if (typeof window.lib === 'undefined' || !window.lib.windvane) {
  setBig('未检测到淘宝容器（WindVane 桥缺失）');
  log('window.lib.windvane 不存在——请确认是在手机淘宝内打开本页', '#d0021b');
  return;
}
log('WindVane 桥 OK', '#0a7d32');
if (!deliveryId) { setBig('缺少任务参数'); return; }

// ===== 第 1 步：queryItem（原生通道）=====
setBig('正在连接任务…');
wvMtop({
  api: 'mtop.taobao.pentaprism.scene.queryItem', v: '1.0',
  data: {sceneId: sceneId, deliveryId: deliveryId}, ecode: '1'
}, function(e){
  // 成功
  var d = (typeof e.data === 'string') ? (function(){ try { return JSON.parse(e.data); } catch(x){ return {}; } })() : (e.data || {});
  var m = d.model || {};
  var pr = m.progress || {};
  var st = pr.status || '';
  var asac = (m.taskParams || {}).asac || '';
  var dur = Number((m.assets || {}).duration) || waitSec;
  log('queryItem OK: status=' + st + ' need=' + pr.needTimes + '/' + pr.maxTimes + ' asac=' + (asac || '(空)') + ' dur=' + (m.assets || {}).duration, '#0a7d32');
  log('model implId=' + ((m.taskParams || {}).implId || '(空)'));
  if (st === 'COMPLETE' || (pr.needTimes === 0 && pr.maxTimes)) { setBig('本轮任务已完成'); return; }
  if (st !== 'ACCEPTED') { setBig('任务状态：' + st); return; }
  // ===== 第 2 步：倒计时 =====
  var n = dur;
  setBig('浏览本页面 <b>' + n + '</b> 秒后，可获得奖励');
  var timer = setInterval(function(){
    n--;
    if (n > 0) { setBig('浏览本页面 <b>' + n + '</b> 秒后，可获得奖励'); return; }
    clearInterval(timer);
    setBig('正在领取奖励…');
    // ===== 第 3 步：trigger（原生通道）=====
    wvMtop({
      api: 'mtop.taobao.pentaprism.scene.trigger', v: '1.0',
      data: {sceneId: sceneId, deliveryId: deliveryId, implId: implId, asac: asac}, ecode: '1'
    }, function(e2){
      var d2 = (typeof e2.data === 'string') ? (function(){ try { return JSON.parse(e2.data); } catch(x){ return {}; } })() : (e2.data || {});
      var m2 = d2.model || {};
      var st2 = m2.status || '';
      var ec = d2.errorCode || '';
      log('trigger: status=' + st2 + ' errorCode=' + ec, (st2==='CURRENT_COMPLETE'||st2==='AWARDING'||st2==='COMPLETE') ? '#0a7d32' : '#d0021b');
      log('trigger 全文: ' + JSON.stringify(e2).slice(0, 500));
      if (st2 === 'CURRENT_COMPLETE' || st2 === 'AWARDING' || st2 === 'COMPLETE') {
        setBig('任务完成，奖励已发放');
      } else if (ec === 'request_auth_failed') {
        setBig('领取被拦截（来源校验）'); setSub('截图发助手');
      } else {
        setBig('返回：' + (st2 || ec || '未知')); setSub('截图发助手');
      }
    }, function(e2){
      setBig('领取请求失败');
      log('trigger FAIL: ' + JSON.stringify(e2).slice(0, 400), '#d0021b');
    });
  }, 1000);
}, function(e){
  var s = JSON.stringify(e);
  setBig('任务查询失败');
  log('queryItem FAIL: ' + s.slice(0, 400), '#d0021b');
  setSub('截图发助手');
});
})();
</script>
</body>
</html>
