<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="always">
<title>面板探针</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0f1115;color:#e6e8ee;font:14px/1.6 -apple-system,"PingFang SC",sans-serif;padding:12px 12px 96px}
  h1{font-size:17px;margin:4px 0 12px;color:#ffd666}
  .sec{background:#181b22;border:1px solid #262a34;border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .sec h2{font-size:13px;margin:0 0 8px;color:#7aa7ff;font-weight:600}
  .line{font:12px/1.55 Menlo,Consolas,monospace;word-break:break-all;padding:3px 0;border-bottom:1px dashed #22252d}
  .line:last-child{border:0}
  .ok{color:#5ee08a}.bad{color:#ff6b6b}.warn{color:#ffb84d}.k{color:#8b93a7}
  pre{white-space:pre-wrap;word-break:break-all;font:11px/1.5 Menlo,monospace;background:#11141a;padding:8px;border-radius:6px;max-height:340px;overflow:auto;margin:6px 0 0}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;background:#0f1115ee;border-top:1px solid #262a34;display:flex;gap:8px}
  button{flex:1;padding:12px;border-radius:9px;border:0;font-size:15px;font-weight:600;background:#2b6cff;color:#fff}
  button:active{opacity:.75}
  button.g{background:#2a2f3a;color:#cfd6e4}
</style>
</head>
<body>
<h1>淘金币面板探针</h1>
<div class="sec"><h2>环境</h2><div id="envBody"></div></div>
<div class="sec"><h2>探测结果</h2><div id="resBody"></div></div>
<div id="bar">
  <button class="g" id="btnCopy">复制全部</button>
  <button id="btnAgain">重新探测</button>
</div>
<script>
(function () {
  var envBody = document.getElementById('envBody');
  var resBody = document.getElementById('resBody');
  var REC = [];          // 供复制用

  function add(box, k, v, cls) {
    var d = document.createElement('div');
    d.className = 'line ' + (cls || '');
    d.textContent = k + ': ' + v;
    box.appendChild(d);
    return k + ': ' + v;
  }
  function rec(s) { REC.push(s); }
  function e(k, v, c) { rec(add(envBody, k, v, c)); }
  function r(k, v, c) { rec(add(resBody, k, v, c)); }

  var API = 'mtop.coingame.task.panel.operate';
  var MODULES = ['PRODUCT_BROWSE', 'DAILY', 'SELECTION', 'BASIC'];
  var VERSIONS = ['legacy', 'v2', 'v3'];
  var SCENE = '5365';

  function mkData(mod, ver) {
    return {
      d1: SCENE,
      d2: 'QUERY',
      c1: JSON.stringify({ version: ver, module: mod, api: API }),
      c4: ''
    };
  }

  function brief(resp) {
    if (!resp) return 'null';
    var ret = resp.ret || (resp.data && resp.data.ret) || resp.statusCode || '';
    if (Array.isArray(ret)) ret = ret.join(' | ');
    var d = resp.data || {};
    var model = d.model;
    var n = Array.isArray(model) ? model.length : (model ? 1 : 0);
    return String(ret) + '  model=' + n;
  }

  // ---------- 环境 ----------
  var ua = navigator.userAgent || '';
  e('UA', ua.slice(0, 160), 'k');
  e('WindVane', typeof window.WindVane, window.WindVane ? 'ok' : 'bad');
  e('WindVane.call', typeof (window.WindVane && window.WindVane.call));
  e('lib', typeof window.lib);
  e('lib.mtop', typeof (window.lib && window.lib.mtop), (window.lib && window.lib.mtop) ? 'ok' : 'warn');
  e('AlibabaJSApi', typeof window.AlibabaJSApi);
  e('__MU__.Mtop', typeof (window.__MU__ && window.__MU__.Mtop));
  e('ebridge', typeof window.ebridge);
  e('pageUrl', location.href.slice(0, 120), 'k');

  // ---------- 结果处理 ----------
  var best = null;

  function onResult(tag, resp) {
    var s = brief(resp);
    var ok = /SUCCESS/.test(s);
    r(tag, s, ok ? 'ok' : 'bad');
    if (ok && !best) best = resp;
    if (ok && resp && resp.data && Array.isArray(resp.data.model) && resp.data.model.length) {
      dumpTasks(tag, resp.data.model);
    }
  }

  function dumpTasks(tag, model) {
    var pre = document.createElement('pre');
    var lines = [];
    lines.push('===== ' + tag + ' 共 ' + model.length + ' 组 =====');
    for (var i = 0; i < model.length; i++) {
      var g = model[i] || {};
      var sub = g.subList || [];
      var arr = [g].concat(sub);
      for (var j = 0; j < arr.length; j++) {
        var t = arr[j] || {};
        var a = t.assets || {};
        var ex = a.extra || {};
        var pr = t.progress || {};
        lines.push([
          'id=' + t.id,
          'status=' + (t.status || pr.status || ''),
          'type=' + (t.taskType || ''),
          'act=' + (a.actionType || ''),
          'extraType=' + (ex.type || ''),
          'dur=' + (a.duration === undefined ? '' : a.duration),
          'x=' + (pr.times === undefined ? '' : pr.times) + '/' + (pr.maxTimes === undefined ? '' : pr.maxTimes),
          '"' + (a.title || '') + '"'
        ].join(' '));
        if (a.action) lines.push('    action=' + a.action);
        if (ex && Object.keys(ex).length) lines.push('    extra=' + JSON.stringify(ex));
        if (t.taskParams) lines.push('    params=' + JSON.stringify(t.taskParams));
      }
    }
    pre.textContent = lines.join('\n');
    resBody.appendChild(pre);
    rec(pre.textContent);
  }

  // ---------- 通道1: WindVane MtopWVPlugin ----------
  function tryWindVaneMtop(done) {
    if (!window.WindVane || typeof window.WindVane.call !== 'function') {
      r('WV MtopWVPlugin', 'WindVane 不存在，跳过', 'warn');
      return done();
    }
    var pending = 1, finished = false;
    function fin() { if (--pending <= 0 && !finished) { finished = true; done(); } }
    pending = 1;

    var params = {
      api: API,
      v: '1.0',
      type: 'originaljson',
      dataType: 'json',
      data: JSON.stringify(mkData('BASIC', 'legacy')),
      ext_headers: JSON.stringify({ pageUrl: location.href })
    };
    var called = false;
    try {
      window.WindVane.call('MtopWVPlugin', 'send', params, function (res) {
        called = true;
        onResult('WV MtopWVPlugin', res);
        fin();
      }, function (err) {
        called = true;
        r('WV MtopWVPlugin', 'FAIL ' + JSON.stringify(err).slice(0, 200), 'bad');
        fin();
      });
    } catch (ex) {
      r('WV MtopWVPlugin', 'EXC ' + ex.message, 'bad');
      fin();
    }
    setTimeout(function () {
      if (!called) { r('WV MtopWVPlugin', '超时无回调', 'warn'); fin(); }
    }, 6000);
  }

  // ---------- 通道2: lib.mtop ----------
  function tryLibMtop(done) {
    var mt = (window.lib && window.lib.mtop) || (window.__MU__ && window.__MU__.Mtop);
    if (!mt) { r('lib.mtop', '不存在，跳过', 'warn'); return done(); }
    var pending = 1, finished = false;
    function fin() { if (--pending <= 0 && !finished) { finished = true; done(); } }
    var called = false;
    try {
      var req = {
        api: API, v: '1.0', type: 'originaljson', dataType: 'json',
        ecode: 1, isSec: 1,
        data: mkData('BASIC', 'legacy'),
        ext_headers: { pageUrl: location.href }
      };
      var fn = mt.request2 || mt.request;
      fn.call(mt, req, function (res) {
        called = true; onResult('lib.mtop', res); fin();
      }, function (err) {
        called = true; r('lib.mtop', 'FAIL ' + JSON.stringify(err).slice(0, 200), 'bad'); fin();
      });
    } catch (ex) {
      r('lib.mtop', 'EXC ' + ex.message, 'bad'); fin();
    }
    setTimeout(function () {
      if (!called) { r('lib.mtop', '超时无回调', 'warn'); fin(); }
    }, 6000);
  }

  // ---------- 通道3: 全模块扫描（仅当有通道成功） ----------
  function scanAll(done) {
    if (!best) { r('全模块扫描', '跳过（无可用通道）', 'warn'); return done(); }
    r('全模块扫描', '开始 ' + MODULES.length + '×' + VERSIONS.length + ' 组', 'k');
    var mt = (window.lib && window.lib.mtop) || (window.__MU__ && window.__MU__.Mtop);
    var jobs = [];
    MODULES.forEach(function (m) {
      VERSIONS.forEach(function (v) { jobs.push([m, v]); });
    });
    var i = 0;
    function next() {
      if (i >= jobs.length) return done();
      var job = jobs[i++];
      var tag = job[0] + '/' + job[1];
      var cnt = 0;
      function fin() { cnt++; if (cnt >= 1) setTimeout(next, 350); }
      var called = false;
      try {
        if (window.WindVane && typeof window.WindVane.call === 'function') {
          window.WindVane.call('MtopWVPlugin', 'send', {
            api: API, v: '1.0', type: 'originaljson', dataType: 'json',
            data: JSON.stringify(mkData(job[0], job[1])),
            ext_headers: JSON.stringify({ pageUrl: location.href })
          }, function (res) { called = true; onResult(tag, res); fin(); },
             function (err) { called = true; r(tag, 'FAIL', 'bad'); fin(); });
        } else if (mt) {
          (mt.request2 || mt.request).call(mt, {
            api: API, v: '1.0', type: 'originaljson', dataType: 'json', ecode: 1, isSec: 1,
            data: mkData(job[0], job[1]), ext_headers: { pageUrl: location.href }
          }, function (res) { called = true; onResult(tag, res); fin(); },
             function (err) { called = true; r(tag, 'FAIL', 'bad'); fin(); });
        } else { fin(); }
      } catch (ex) { r(tag, 'EXC', 'bad'); fin(); }
      setTimeout(function () { if (!called) { r(tag, '超时', 'warn'); fin(); } }, 6000);
    }
    next();
  }

  // ---------- 主流程 ----------
  function run() {
    resBody.innerHTML = '';
    REC.length = 0;
    // 重新记录环境
    e('UA', ua.slice(0, 160), 'k');
    e('WindVane', typeof window.WindVane, window.WindVane ? 'ok' : 'bad');
    e('lib.mtop', typeof (window.lib && window.lib.mtop));

    tryWindVaneMtop(function () {
      tryLibMtop(function () {
        scanAll(function () {
          r('完成', best ? '有成功通道 ✅' : '全部失败 ❌',
            best ? 'ok' : 'bad');
        });
      });
    });
  }

  document.getElementById('btnAgain').addEventListener('click', run);
  document.getElementById('btnCopy').addEventListener('click', function () {
    var txt = REC.join('\n');
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(txt).then(function () {
        alert('已复制');
      }, function () { alert('复制失败，请长按选择'); });
    } else {
      alert(ok ? '已复制' : '复制失败，请长按选择');
    }
  });

  run();
})();
</script>
</body>
</html>
